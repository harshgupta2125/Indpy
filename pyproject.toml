[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indpy_core"
version = "0.1.5"
description = "A comprehesive library for Indian Identity and Financial data validation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Harsh Gupta", email = "harsh2125gupta@gmail.com"},
]
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/harshgupta2125/Indpy"
"Bug Tracker" = "https://github.com/harshgupta2125/Indpy/issues"

[project.scripts]
indpy = "indpy.cli:main"

[tool.black]
line-length = 88
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ['E203', 'W503']
exclude = ['.git', '__pycache__', 'build', 'dist', '.venv']

[tool.pylint]
max-line-length = 88
disable = ['C0114', 'W0622', 'R0903']
